<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .cell {
        background: black;
        font-family: "Montserrat";
        color: white;
        font-size: 1.25rem;
        padding: 10px;
        text-align: center;
      }

      .grid--container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 20px;
        margin: 20px 60px;
      }

      .search--query {
        margin-top: 20px;
        margin-left: 60px;
        width: 100%;
      }

      .pagination {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-top: 60px;
      }

      .pagination .btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: white;
        border: 1px solid black;
        color: black;
        font-size: 1.25rem;
        font-family: "Montserrat";
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: 500;
        user-select: none;
      }

      .pagination .btn.active {
        background: #22c55e;
        border-color: #22c55e;
        color: white;
      }

      .dots {
        font-weight: 500;
        font-size: 2rem;
        line-height: 0;
        display: block;
        margin-bottom: 15px;
        user-select: none;
      }


      .dots {
    font-weight: 500;
    font-size: 2rem;
    line-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    user-select: none;
    cursor: pointer;
    min-width: 40px;
    height: 40px;
    transition: color 0.2s;
}
.dots:hover {
    color: #22c55e;
}

.jump-input {
    width: 56px;
    height: 36px;
    padding: 0 6px;
    border: 1px solid #22c55e;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    outline: none;
    /* убираем стрелки у number */
    -moz-appearance: textfield;
}
.jump-input::-webkit-outer-spin-button,
.jump-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.jump-input.invalid {
    border-color: #e11d48;
    animation: shake 0.2s;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
}
    </style>
  </head>
  <body>
    <div class="search--query">
      <input type="text" name="dish" id="dish" />
      <select name="new" id="new">
        <option selected value="old">Oldest</option>
        <option value="new">Newest</option>
      </select>
    </div>

    <div class="grid--container" id="gridCont">
      <p>Loading...</p>
    </div>

    <div class="pagination" id="pag"></div>

    <script>
      const cardsPerPage = 16;

      const grid = document.getElementById("gridCont");
      const pag = document.getElementById("pag");

      let content = "";

      let activePage = 1;

      let pages = false;

      getData().then((pagesCount) => {
        if (!pagesCount) {
          console.log("Error");
          return;
        }

        pages = pagesCount;

        setActivePage(pages, 1);
        setControls();
      });

      function setActivePage(pages, page = 1) {
        page = Number(page);
        let newContent = "";

        if (pages > 5) {
          if (page < 4) {
            for (let i = 0; i < page + 1; i++) {
              newContent +=
                '<div class="btn" id="page' +
                (i + 1) +
                '">' +
                (i + 1) +
                "</div>";
            }

            newContent += '<div class="dots" data-role="jump">...</div>';

            for (let i = pages - 2; i < pages; i++) {
              newContent +=
                '<div class="btn" id="page' +
                (i + 1) +
                '">' +
                (i + 1) +
                "</div>";
            }
          } else if (page + 2 >= pages) {
            newContent += '<div class="btn" id="page1">1</div>';

            newContent += '<div class="dots" data-role="jump">...</div>';

            for (let i = page - 2; i < pages; i++) {
              newContent +=
                '<div class="btn" id="page' +
                (i + 1) +
                '">' +
                (i + 1) +
                "</div>";
            }
          } else {
            newContent += '<div class="btn" id="page1">1</div>';

            newContent += '<div class="dots" data-role="jump">...</div>';

            for (let i = page - 2; i < page + 1; i++) {
              newContent +=
                '<div class="btn" id="page' +
                (i + 1) +
                '">' +
                (i + 1) +
                "</div>";
            }

            newContent += '<div class="dots" data-role="jump">...</div>';

            newContent +=
              '<div class="btn" id="page' + pages + '">' + pages + "</div>";
          }

          pag.innerHTML = newContent;
          newContent = "";

          for (let i = 0; i < pag.children.length; i++) {
            pag.children[i].classList.remove("active");
          }
          pag.querySelector("#page" + page).classList.add("active");
        } else {
          for (let i = 1; i <= pages; i++) {
            newContent += `<div class="btn" id="page${i}">${i}</div>`;
          }

          pag.innerHTML = newContent;
          for (let i = 0; i < pag.children.length; i++) {
            pag.children[i].classList.remove("active");
          }
          pag.querySelector("#page" + page).classList.add("active");
        }

        activePage = page;

        getData(activePage - 1, searchName, oldest);

        return activePage;
      }

      function updatePagination(pages) {
        setActivePage(pages, 1);

        return true;
      }

      function setControls() {
          pag.addEventListener('click', (e) => {
              const dots = e.target.closest('.dots');
              if (dots) {
                  e.preventDefault();
                  showJumpInput(dots);
                  return;
              }

              const btn = e.target.closest('.btn');
              if (!btn) return;

              const page = parseInt(btn.innerHTML, 10);
              if (!page) return;

              setActivePage(pages, page);
          });
      }

      function showJumpInput(dotsEl) {
    if (dotsEl.dataset.active === 'true') return;

    const total = Number(pages);
    const current = activePage;

    dotsEl.dataset.active = 'true';
    dotsEl.innerHTML = `<input 
        type="number" 
        class="jump-input" 
        min="1" 
        max="${total}" 
        value="${current}" 
        placeholder="№"
        autocomplete="off"
    >`;

    const input = dotsEl.querySelector('.jump-input');
    input.focus();
    input.select();

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const page = parseInt(input.value, 10);
            if (page >= 1 && page <= total) {
                setActivePage(pages, page);
            } else {
                input.classList.add('invalid');
                setTimeout(() => input.classList.remove('invalid'), 500);
            }
        }
        if (e.key === 'Escape') {
            setActivePage(pages, activePage);
        }
    });

    input.addEventListener('blur', () => {
        setActivePage(pages, activePage);
    });

    input.addEventListener('beforeinput', (e) => {
        if (e.data && !/^\d+$/.test(e.data)) e.preventDefault();
    });
}

      oldest = true;
      let searchName = "";

      const search = document.querySelector("input");

      search.addEventListener("change", async () => {
        searchName = search.value.trim();
        const pagesCount = await getData(0, search.value.trim(), oldest);
        if (!pagesCount) return;

        pages = pagesCount;
        activePage = 1;
        updatePagination(pages);
      });

      let data = [];

      async function getData(page = 0, name = "", oldest = true) {
        try {
          const response = await fetch("test.json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          data = await response.json();

          let items = data.items.filter((item) =>
            item.title.toLowerCase().includes(name.toLowerCase()),
          );
          if (!oldest) items = items.reverse();
          let total = Math.min(+data.total, items.length);
          let limit = Math.min(
            cardsPerPage,
            Math.abs(+total - page * cardsPerPage),
          );

          let newPages = Math.ceil(total / cardsPerPage);

          // ONLY WITHOUT BACKEND (OWB)

          let start = page * cardsPerPage;
          let end = start + limit;

          items = items.slice(start, end);

          // END OWB

          let newContent = "";
          for (let i = 0; i < limit; i++) {
            newContent +=
              '<div class="cell" data-time="' +
              items[i].timestamp +
              '">' +
              items[i].id +
              " <div>" +
              items[i].title +
              "</div></div>";
          }

          grid.innerHTML = newContent;

          newContent = "";

          return newPages;
        } catch (err) {
          console.error("Error: " + err);
          return false;
        }
      }

      const selectorOldest = document.getElementById("new");

      selectorOldest.addEventListener("change", () => {
        oldest = selectorOldest.value === "old";

        getData(0, searchName, oldest);

        setActivePage(pages, 1);
      });
    </script>
  </body>
</html>
