<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moving gradient</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* Запасной фон, если WebGPU недоступен (цвета = стандартный градиент) */
      body {
        background: linear-gradient(135deg, #ffe99e, #817bff, #ff009b);
        font-family: system-ui, sans-serif;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: -1;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        color: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <main><h1>Moving gradient</h1></main>

    <script type="module">
      import { createMovingGradient } from "./js/moving-gradient.js";

      const canvas = document.getElementById("bg");

      function whenLoaded() {
        if (document.readyState === "complete") return Promise.resolve();
        return new Promise((resolve) =>
          window.addEventListener("load", resolve, { once: true }),
        );
      }

      await whenLoaded();

      let fx = null;
      try {
        fx = await createMovingGradient(canvas, {
          gradient: {
            stops: [
              { position: 0, color: "#a8ff78" }, // пример, подставьте свои
              { position: 0.5, color: "#1db954" },
              { position: 1, color: "#0b6e4f" },
            ],
          },
        });
      } catch (e) {
        console.warn("WebGPU init failed", e);
      }
      if (!fx) canvas.remove();
    </script>
  </body>
</html>
