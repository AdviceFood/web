<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis</title>

    <link rel="stylesheet" href="styles/style.css" />

    <style>
      *,
      *:after,
      *:before {
        box-sizing: border-box;
      }

      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: normal;
        margin: 0;
        font-style: normal;
      }

      body,
      html {
        margin: 0;
        background: var(--lt-body);
        overflow-x: hidden;
        max-width: 100vw;
      }

      a.header--logo {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: var(--lt-main);
      }

      a.header--logo b {
        font-size: 1.5rem;
      }

      a.header--logo b span {
        color: var(--lt-text-alt);
      }

      .container {
        max-width: 83.3vw;
        width: 100%;
        margin: 0 auto;
      }

      .header--inner {
        padding-top: 26px;
        padding-bottom: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .burger--button {
        background: var(--lt-burger-bg);
        height: 44px;
        width: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .burger--line {
        width: 22px;
        height: 3px;
        border-radius: 5px;
        background: var(--lt-text-alt);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translateY(-50%) translateX(-50%);
      }

      header nav {
        margin: 0;
        padding: 0;
      }

      .nav--list {
        position: absolute;
        left: -100%;
      }

      .burger--line:nth-child(1) {
        width: 22px;
        height: 3px;
        border-radius: 5px;
        background: var(--lt-text-alt);
        transform: translateY(-10px) translateX(-50%);
        top: 50%;
        left: 50%;
        position: absolute;
      }
      .burger--line:nth-child(3) {
        width: 22px;
        height: 3px;
        border-radius: 5px;
        background: var(--lt-text-alt);
        transform: translateY(7px) translateX(-50%);
        top: 50%;
        left: 50%;
        position: absolute;
      }

      .nav--list {
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-bottom: 20px;
        position: relative;
        margin-left: auto;
        margin-right: auto;
        padding-left: 0;
        margin-top: 0;
        margin-bottom: 0;
      }

      .nav--list::after {
        position: absolute;
        content: "";
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 83.3vw;
        max-width: 350px;
        height: 1px;
        background: var(--lt-menu-line);
        border-radius: 1px;
      }

      .nav--list:last-child::after {
        display: none;
      }

      ul.nav--list li {
        width: 83.3vw;
        max-width: 400px;
        height: 52px;
        margin: 0;
        padding: 0;
        border-radius: 26px;
        list-style: none;
      }

      ul.nav--list li a {
        -webkit-transform: scale(1);
        transform: scale(1);
        padding: 13px 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--lt-main);
        text-decoration: none;
        font-family: "AA";
        font-weight: 500;
        font-size: 1.25rem;
        font-style: normal;
        border-radius: 26px;
        transition: 0.3s;
        -webkit-transition: 0.3s;
      }

      ul.nav--list li a b {
        font-weight: 500;
      }

      .navigation--menu {
        position: fixed;
        left: 0;
        right: auto;
        top: 0;
        transition: 0.3s;
        padding-top: 102px;
        transform: translateX(100%);
        width: 100vw;
        height: 100vh;

        background: var(--lt-menu);

        transition:
          transform 0.35s ease-in-out,
          visibility 0.35s ease-in-out;
      }

      header {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        z-index: 100;
      }

      .navigation--menu {
        z-index: -1;
        left: -8.35vw;
      }

      .navigation--menu .nav--list {
        align-items: center;
      }

      .utility--hint {
        opacity: 0;
        pointer-events: none;
      }

      main {
        padding-top: 128px;
      }

      a.back--block {
        display: inline-flex;
        gap: 5px;
        text-decoration: none;
        color: var(--lt-back);
        align-items: center;
        margin-bottom: 25px;
        order: 1;
      }

      a.back--block span {
        font-size: 1rem;
        font-family: "AA";
        font-weight: 400;
      }

      section.section--meta {
        display: flex;
        flex-direction: column;
      }

      .analyze__photo--wrapper {
        order: 2;
        margin-bottom: 20px;
        padding-bottom: 20px;
        transition: 0.35s padding-bottom ease-in-out;
        -webkit-transition: 0.35s padding-bottom ease-in-out;
      }

      .analyze--dish {
        order: 5;
      }

      .analyze__utility--container {
        order: 4;
      }

      .analyze__photo--comment {
        order: 3;
        background: var(--lt-comment);
      }

      .analyze--calories {
        order: 6;
      }

      .analyze__photo--file {
        width: 100%;
        aspect-ratio: 300 / 186;
        object-fit: cover;
        border-radius: 15px;
      }

      .analyze__photo--block {
        position: relative;
        display: flex;
        height: calc(83.3vw * 0.62);
        transition: 0.35s height ease-in-out;
        -webkit-transition: 0.35s height ease-in-out;
      }

      .analyze__photo--hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
        opacity: 0;
        pointer-events: none;
        font-size: 1rem;
        font-weight: 500;
        font-family: "AA";
        white-space: nowrap;
        color: var(--lt-menu);
        z-index: 2;
        transition:
          0.35s top ease-in-out,
          0.35s opacity ease-in-out;
        -webkit-transition:
          0.35s top ease-in-out,
          0.35s opacity ease-in-out;
      }

      .analyze__photo--hint:last-child {
        color: var(--lt-main);
        top: calc(100% + 15px);
        opacity: 1;
        pointer-events: auto;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .analyze__photo--wrapper .analyze__photo--block::after {
        opacity: 0;
        position: absolute;
        width: 100%;
        height: 100%;
        background: #000;
        left: 0;
        top: 0;
        content: "";
        border-radius: 15px;
        transition: 0.35s opacity ease-in-out;
        -webkit-transition: 0.35s opacity ease-in-out;
      }

      .analyze__photo--wrapper.closed {
        padding-bottom: 0;
        overflow: hidden;
      }

      .analyze__photo--wrapper.closed .analyze__photo--block {
        height: 42px;
      }

      .analyze__photo--wrapper.closed .analyze__photo--hint:nth-child(2) {
        padding: 20px 50%;
      }

      .analyze__photo--wrapper.closed .analyze__photo--block::after {
        opacity: 0.5;
      }

      .analyze__photo--wrapper .analyze__photo--hint:nth-child(2) {
        top: calc(50% + 20px);
      }

      .analyze__photo--wrapper.closed .analyze__photo--hint:nth-child(2) {
        opacity: 1;
        pointer-events: auto;
        top: 50%;
      }

      .analyze__photo--wrapper.closed .analyze__photo--hint:last-child {
        opacity: 0;
        top: calc(100%);
        pointer-events: none;
      }

      .analyze__photo--comment {
        width: 100%;
        height: auto;
        padding: 15px 20px;
        border-radius: 10px;
        border: 2px dashed #00000080;
      }

      .analyze__photo--comment h3 {
        font-weight: 500;
        font-family: "AA";
        font-size: 1rem;
        color: var(--lt-back);
        margin-bottom: 3px;
      }

      .analyze__photo--comment p {
        font-size: 0.875rem;
        font-family: "AA";
        font-weight: 400;
        padding: 0;
        margin: 0;
        color: var(--lt-back);
      }

      .analyze__utility--container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 30px;
      }

      .analyze__utility--container .utility--diag {
        width: 73px;
        height: 73px;
      }

      .utility--diag {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-family: "AA";
        font-size: 1.75rem;
        color: var(--lt-main);
        font-weight: 500;
      }

      .utility--diag svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .progress-bg {
        fill: none;
        stroke: var(--lt-progress-bg);
        stroke-width: 16px;
      }

      .progress-bar {
        fill: none;
        stroke: #e63946;
        stroke-width: 16px;
        stroke-dasharray: calc(2 * 3.14159 * 64);
        stroke-dashoffset: calc((2 * 3.14159 * 64));
        /* stroke-linecap: round; */
        /* transition: stroke-dashoffset 0.5s ease-in-out; */
      }

      .utility--title {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 3px;
      }

      .utility--title h2 {
        margin: 0;
        color: var(--lt-main);
        font-size: 1.25rem;
        font-weight: 500;
        font-family: "AA";
        white-space: nowrap;
        line-height: 0.4;
      }

      .utility--info p {
        margin: 0;
        color: var(--lt-back);
        font-size: 1rem;
        font-family: "AA";
      }

      .analyze--dish {
        margin-top: 22px;
        margin-bottom: 22px;
      }

      .analyze--dish h1 {
        font-weight: 700;
        font-family: "AA";
        font-size: 1.25rem;
        margin-bottom: 7px;
      }

      .analyze--dish p {
        font-family: "AA";
        font-weight: 400;
        font-size: 1rem;
        color: var(--lt-back);
        line-height: 1.26;
      }

      .analyze--calories {
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 4px 20px 0 #0000001a;
        margin-bottom: 31px;
        font-family: "AA";
      }

      .cal--total strong {
        font-size: 1.25rem;
        font-weight: 500;
        line-height: 0;
      }

      .analyze--calories strong span {
        font-weight: 400;
        font-size: 1rem;
        color: var(--lt-back);
      }

      .cal--flex strong {
        font-size: 1.125rem;
        line-height: 0;
        white-space: nowrap;
      }

      .cal--flex {
        display: flex;
        margin-top: 7px;
      }

      .cal--block {
        padding-left: 12px;
        padding-right: 12px;
      }

      .cal--block:first-child {
        padding-left: 0;
        border-right: 1px solid #0000001a;
      }

      .cal--block:last-child {
        padding-right: 0;
        border-left: 1px solid #0000001a;
      }

      .utility--title svg {
        position: relative;
      }

      .svg--wrapper {
        display: flex;
        position: relative;
      }

      .svg--wrapper:after {
        position: absolute;
        content: "";
        width: 1cm;
        height: 1cm;
        background: transparent;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
      }

      .main--right .analyze__photo--comment {
        display: none;
      }

      main .container {
        display: flex;
        flex-direction: column;
      }

      .section--nutrition {
        padding-top: 30px;
        border-top: 2px solid #0000001a;
        font-family: "AA";
      }

      .nutrition--title {
        font-size: 1.5rem;
        font-weight: 500;
        color: var(--lt-main);
      }

      .nutrition--subtitle {
        font-size: 1rem;
        color: var(--lt-back);
        margin-bottom: 20px;
      }

      .nutrition--circle {
        width: 190px;
        height: 190px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
      }

      .nutrition--circle strong {
        font-size: 1.625rem;
        font-weight: 500;
        color: var(--lt-main);
        margin-top: 10px;
      }

      .nutrition--circle span {
        color: var(--lt-back);
        font-size: 1.25rem;
      }

      .nutrition--circle svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .nutrition--circle--bg {
        fill: none;
        stroke: var(--lt-progress-bg);
        stroke-width: 12px;
      }

      .nutrition--circle--bar {
        fill: none;
        stroke-width: 12px;
        stroke: #22c55e;
        stroke-dasharray: calc(2 * 3.1415 * 66);
        stroke-dashoffset: calc((2 * 3.1415 * 66));

        /* transition: 0.3s stroke-dashoffset; */

        /* stroke-linecap: round; */
      }

      ul.nutrition--items {
        list-style: none;
        padding: 0;
        margin: 0;
        margin-top: 25px;
        margin-bottom: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      li.nutrition--item {
        width: 100%;
        /* max-width: 300px; */
        height: 70px;
        border-radius: 10px;
        box-shadow: 0 4px 20px 0 #0000001a;
        padding: 15px;
        padding-left: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: var(--lt-menu);
      }

      .nutrition--icon {
        width: 30px;
        height: 30px;
        min-width: 30px;
      }

      .nutrition--desc {
        width: 100%;
      }

      .nutrition--text {
        display: flex;
        align-items: center;
      }

      .nutrition--text h3 {
        font-weight: 500;
        font-size: 1rem;
        color: var(--lt-main);
      }

      .nutrition--text span {
        margin-left: 8px;
        margin-right: auto;
        font-size: 1rem;
        font-weight: 400;
        color: var(--lt-back);
      }

      .nutrition--text b {
        font-weight: 500;
        font-size: 1rem;
        color: var(--lt-back);
      }

      .nutrition--line {
        height: 15px;
        margin-top: 6px;
      }

      .nutrition--line progress {
        height: 15px;
        width: 100%;

        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        border: none;
        padding: 0;
        margin: 0;

        border-radius: 10px;
        display: block;
        overflow: hidden;
      }

      .nutrition--line progress::-webkit-progress-bar {
        background-color: var(--lt-progress-bg);
        border-radius: 10px;
      }

      .nutrition--line progress::-webkit-progress-value {
        background-color: #d96c63;
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .nutrition--item:nth-child(2)
        .nutrition--line
        progress::-webkit-progress-value {
        background-color: #d9a441;
      }

      .nutrition--item:nth-child(3)
        .nutrition--line
        progress::-webkit-progress-value {
        background-color: #d8894a;
      }

      .nutrition--line progress::-moz-progress-bar {
        background-color: #d8894a;
        border-radius: 10px;
      }

      .nutrition--notice {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 15px;
        padding: 14px 10px;
        background-color: var(--lt-menu);
        margin-bottom: 70px;
        width: 100%;
        /* max-width: 300px; */
        margin-left: auto;
        margin-right: auto;
      }

      .nutrition--notice p {
        font-size: 0.875rem;
        color: var(--lt-back);
        font-weight: 400;
        margin: 0;
      }

      .analyze--navigation {
        display: none;
      }

      .section--ing {
        font-family: "AA";
      }

      .ing--title {
        font-size: 1.5rem;
        font-weight: 500;
      }

      .ing--subtitle {
        color: var(--lt-back);
        margin-bottom: 20px;
      }

      .ing--block {
        background: var(--lt-menu);
        padding: 25px;
        box-shadow: 0 4px 20px 0 #0000001a;
        border-radius: 15px;
      }

      .ing--col h3 {
        font-size: 1.125rem;
        font-weight: 500;
      }

      ul.ing--list {
        padding: 0;
        margin: 0;
        list-style: none;
        margin: 15px 0 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 168px;
        height: auto;
        overflow-y: hidden;
      }

      li.ing--item {
        display: flex;
        align-items: center;
      }

      span.ing--color {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: #ff8f0040;
        display: block;
        position: relative;
      }

      span.ing--color::after {
        position: absolute;
        content: "";
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translateY(-50%);
        width: 16px;
        height: 16px;
        background-color: #ff8f00;
        border-radius: 50%;
      }

      li.ing--item p {
        color: var(--lt-main);
        font-size: 1rem;
        margin-left: 10px;
        margin-right: auto;
      }

      li.ing--item b {
        font-weight: 500;
        font-size: 1rem;
        color: var(--lt-back);
      }

      .ing--container--list .ing--exp--block {
        display: none;
      }

      .ing--container--list.exp {
        position: relative;
      }

      .ing--container--list.exp .ing--exp--block {
        position: absolute;
        display: block;
        bottom: 0;
        height: 60px;
        background: linear-gradient(0deg, white 0%, white 90%, #ffffff00 100%);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ing--exp--block button {
        width: 100%;
        height: 40px;
        border-radius: 20px;
        border: 0;
        font-family: "AA";
        background: #00000008;
        font-size: 1rem;
        color: var(--lt-main);
        transition: 0.3s ease-in-out;
        -webkit-transition: 0.3s ease-in-out;
      }

      .ing--expander {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: 0.3s ease-in-out;
        -webkit-transition: 0.3s ease-in-out;
      }

      .ing--container--list.opened ul.ing--list {
        max-height: unset;
      }

      ul.ing--list {
        transition: 0.35s height ease-in-out;
        -webkit-transition: 0.35s height ease-in-out;
      }

      .ing--container--list button svg {
        transition: 0.35s transform ease-in-out;
        -webkit-transition: 0.35s transform ease-in-out;
      }

      .ing--container--list.opened button svg {
        transform: rotate(180deg);
      }

      .ing--exp--block button:active {
        transition: 0.05s all ease-in-out;
        -webkit-transition: 0.05s all ease-in-out;
        background: #00000026;
        transform: scale(0.98);
      }

      li.risk--item {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      span.risk--icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ff8f001a;
      }

      .risk--item strong {
        color: #ff8f00;
        font-weight: 500;
      }

      .risk--item p {
        color: var(--lt-back);
      }

      .risk--item b {
        color: var(--lt-main);
        font-weight: 500;
      }

      ul.risks--list {
        padding: 0;
        margin: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }

      .risk--item.great span.risk--icon {
        background: #22c55e1a;
      }

      .risk--item.great strong {
        color: #22c55e;
      }

      .ing--block {
        padding: 16px 18px;
      }

      .ing--block:first-child {
        padding: 25px;
        margin-bottom: 5px;
      }

      p.ing--sub {
        color: var(--lt-back);
        font-size: 0.875rem;
      }

      p.ing--sub b {
        font-size: 1rem;
        font-weight: 500;
        color: var(--lt-main);
      }

      .ing--wrapper {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 70px;
      }

      .ing--block#allergens,
      .ing--block#allergens + .ing--block,
      .ing--block#allergens + .ing--block + .ing--block {
        border: 1px solid white;
      }

      .ing--block#allergens {
        transition: 0.3s all;
        -webkit-transition: 0.3s all;
        cursor: pointer;
      }

      .ing--block#allergens:hover {
        border: 1px solid #0000001a;
        background-color: #0000000d;
      }

      .ing--block#allergens:active {
        border: 1px solid #dcdee1;
        background-color: #dcdee1;
        transition: 0.05s all;
        -webkit-transition: 0.05s all;
        transform: scale(0.98);
      }

      .popup--ing {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
        z-index: 500;
        background: white;
        padding: 30px 30px;
        width: 90vw;
        max-width: 444px;
        border-radius: 15px;
        box-shadow: 0 4px 20px 0 #0000001a;
        font-family: "AA";
        transition: 0.35s all;
        -webkit-transition: 0.35s all;
      }

      .popup--ing strong {
        font-size: 1.25rem;
        font-weight: 500;
      }

      .popup--ing ul {
        list-style: none;
        padding: 0;
        margin: 0;
        margin-top: 17px;
        margin-bottom: 20px;
      }

      .popup--ing ul li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 15px;
        color: var(--lt-main);
        font-size: 1.125rem;
      }

      .popup--ing ul li svg {
        transform: scale(1.1);
      }

      .popup--ing ul li:last-child {
        margin-bottom: 0;
      }

      .mask {
        position: fixed;
        z-index: 400;
        pointer-events: auto;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        opacity: 0.7;
        transition: 0.35s all;
        -webkit-transition: 0.35s all;
      }

      .mask.hide {
        pointer-events: none;
        opacity: 0;
      }

      button.popup--close {
        width: 100%;
        height: 42px;
        border: 1px solid #0000001a;
        border-radius: 21px;
        background: white;
        font-family: "AA";
        font-size: 1.125rem;
        color: var(--lt-main);
        font-weight: 500;
        transition: 0.35s all;
        -webkit-transition: 0.35s all;
        cursor: pointer;
      }

      button.popup--close:hover {
        background: #f7f7f7;
        border: 1px solid #f7f7f7;
      }

      button.popup--close:active {
        background: #e6e6e6;
        transform: scale(0.98);
        transition: 0.05s all;
        -webkit-transition: 0.05s all;
      }

      .popup--ing.hide {
        opacity: 0;
        pointer-events: none;
        /* z-index: -1; */
      }

      .ing--sub b.bt {
        font-weight: 700;
      }

      .header--inner {
        position: relative;
      }

      .header--inner:after {
        position: absolute;
        content: "";
        height: 100%;
        width: 20px;
        left: -20px;
        right: auto;
        top: 0;
        background: linear-gradient(
          180deg,
          #f4f6f9 0%,
          #f4f6f9 65%,
          #f4f6f988 100%
        );
        backdrop-filter: blur(0.7px);
        transition: 0.3s all;
        -webkit-transition: 0.3s all;
        opacity: 1;
        z-index: -2;
      }

      .header--inner:before {
        position: absolute;
        content: "";
        height: 100%;
        width: 20px;
        left: auto;
        right: -20px;
        top: 0;
        background: linear-gradient(
          180deg,
          #f4f6f9 0%,
          #f4f6f9 65%,
          #f4f6f988 100%
        );
        backdrop-filter: blur(0.7px);
        transition: 0.5s all ease-in-out;
        -webkit-transition: 0.5s all ease-in-out;
        opacity: 1;
        z-index: -1;
      }

      .main--inner {

      .input--block {
        width: 100%;
        display: flex;
        height: 50px;
        border-radius: 25px;
        padding-left: 15px;
        padding-right: 15px;
        align-items: center;
        background: #ffffff;
        border-color: #e6e6e6;
        border-width: 1px;
        border-style: solid;
        transition:
          0.3s border-color,
          0.3s border-width,
          0.3s background,
          0.3s transform;
        -webkit-transition:
          0.3s border-color,
          0.3s border-color,
          0.3s background,
          0.3s transform;
      }

      .input--block:hover {
        border-color: #d7d7d7;
        border-width: 2px;

      .input--block:active {
        border-color: #c7c7c7;
        transform: scale(0.99);
        transition:
          0.05s border-color,
          0.05s border-width,
          0.05s background,
          0.05s transform;
        -webkit-transition:
          0.05s border-color,
          0.05s border-color,
          0.05s background,
          0.05s transform;

      .input--block:has(input.focused):active {
        transform: scale(1);

      .input--block:has(input:focus) {

      input:focus::placeholder {
        opacity: 0;

      .input--block input {

        border-radius: 8px;
        background: white;
        border: 1px solid #0000001a;
        transition:
          0.1s border,
          0.1s background;
        -webkit-transition:
          0.1s border,
          0.1s background;

      label.checkbox--label a {
        color: #22c55e;
        font-weight: 500;
        text-decoration: underline;
      }

      .checkbox--flex:nth-child(5) {
        margin-top: 12px;

      button.register--btn {
        background: #22c55e;
        transition:
          0.3s background,
          0.3s opacity,
          0.3s transform;

          0.3s background,
          0.3s opacity,
          0.3s transform;

        font-family: "AA";

        transition:
          0.05s background,
          0.05s transform;
        -webkit-transition:
          0.05s background,
          0.05s transform;

      button.register--btn:disabled {
        opacity: 50%;

      button.register--btn:disabled:active,
      button.register--btn:disabled:hover {
        transform: scale(1);
        -webkit-transform: scale(1);
        background: #22c55e;
      }

      span.register--line {
        background: #0000001a;
        height: 1px;
        width: 100%;
        margin-top: 26px;
        margin-bottom: 20px;

        position: relative;
        border-radius: 1px;
        max-width: 450px;

      span.register--line:after {
        position: absolute;
        content: "or";
        top: 50%;
        transform: translateY(-60%) translateX(-50%);
        left: 50%;
        font-family: "AA";
        font-size: 1rem;
        font-weight: 500;
        color: #000000b2;
        padding-left: 10px;
        padding-right: 10px;
        background: #f4f6f9;

      a.alt--btn {
        border: 1px solid #e6e6e6;

        height: 52px;
        border-radius: 26px;
        background: white;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 1rem;
        color: black;
        font-weight: 500;
        transition:
          0.3s background,
          0.3s transform;
        -webkit-transition:
          0.3s background,
          0.3s transform;

      .register--alternatives {
        width: 100%;
        max-width: 450px;
        margin-bottom: 70px;

      a.alt--btn:active {
        transition:
          0.05s background,
          0.05s transform;
        -webkit-transition:
          0.05s background,
          0.05s transform;
        background: #e6e6e6;
        transform: scale(0.98);
      }

      .input--eye {
        position: relative;
        cursor: pointer;
        min-width: 24px;
      }

      .input--eye svg:last-child {
        opacity: 0;
        pointer-events: none;
        position: absolute;
        width: 24px;
        height: 24px;
        min-width: 24px;
        left: 0;
        top: 0;
      }

      .input--eye svg {
        transition: 0.3s opacity;
        -webkit-transition: 0.3s opacity;
      }

      .input--eye.show svg:last-child {
        opacity: 1;
        pointer-events: auto;
        width: 24px;
        height: 24px;
      }

      .input--eye.show svg:first-child {
        opacity: 0;
        pointer-events: none;
      }
